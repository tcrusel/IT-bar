name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]          # Déclenchement sur main
  pull_request:
  workflow_dispatch:              # Exécution manuelle possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      # --- Étape 1 : Récupération du code source ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Étape 2 : Préparation de Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Étape 3 : Vérification du JSON ---
      # Vérifie que src/registers.json est bien formé (empêche les erreurs de syntaxe)
      - name: Validate registers.json syntax
        run: |
          echo "Validating JSON syntax..."
          node -e "JSON.parse(require('fs').readFileSync('src/registers.json', 'utf8')); console.log('✅ registers.json is valid');"

      # --- Étape 4 : Génération automatique du site ---
      - name: Generate static HTML from JSON
        run: |
          rm -rf public-site
          mkdir -p public-site
          node build.js
          touch public-site/.nojekyll

      # --- Étape 5 : Vérification basique des liens internes ---
      # On évite les liens externes (Google Fonts, etc.) pour ne pas bloquer inutilement
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --root-dir "./public-site"
            --verbose
            --no-progress
            "public-site/**/*.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Étape 6 : Upload de l’artefact pour Pages ---
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke test (after deploy)
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Pages to propagate and test
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Testing $URL ..."
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$code" = "200" ] || [ "$code" = "301" ]; then
              echo "✅ Site accessible ($code)"
              exit 0
            fi
            echo "⏳ Attempt $i..."
            sleep 3
          done
          echo "❌ Site not reachable (expected 200/301)"
          exit 1
